# Drive a real GitHub Actions OIDC token into Ravn's echo endpoint.
#
# Three jobs, deliberately different, so one dispatch answers three questions:
#
#   plain          — a normal job. Does `job_workflow_ref` even appear when no
#                    reusable workflow is involved, or does it just mirror
#                    `workflow_ref`? Ravn's whole D2 policy assumes those are
#                    distinguishable, and we have never actually looked.
#   via-reusable   — the same mint, but from inside a called workflow. This is
#                    the shape the real collector uses.
#   wrong-audience — mints with GitHub's DEFAULT audience (the repo owner URL)
#                    instead of ours. MUST be refused. This is the check every
#                    other guarantee rests on, so it is proven, not assumed.
name: refusal taxonomy

on:
  workflow_dispatch: {}

env:
  RAVN_ECHO_URL: https://welch.ngrok.io/attestations/config
  RAVN_AUDIENCE: https://ravnsecurity.io

jobs:
  plain:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Mint OIDC token and POST it
        run: |
          set -euo pipefail
          # ❗If `id-token: write` is missing, or org policy restricts it, these
          # env vars are simply ABSENT and every downstream error is misleading.
          # Fail here, with the actual reason.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint. The job lacks id-token: write, or org policy blocks it."
            exit 1
          fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RAVN_AUDIENCE}" | jq -r '.value')
          echo "Minted token (${#TOKEN} chars). Posting to Ravn…"
          curl -sS -i -X POST "$RAVN_ECHO_URL" -H "Authorization: Bearer $TOKEN"

  via-reusable:
    uses: ./.github/workflows/reusable-echo.yml
    permissions:
      id-token: write
      contents: read

  wrong-audience:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Mint with GitHub's DEFAULT audience — expect refusal
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint."; exit 1
          fi
          # No &audience= — GitHub defaults to the repository owner's URL.
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          CODE=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST "$RAVN_ECHO_URL" \
            -H "Authorization: Bearer $TOKEN")
          echo "HTTP $CODE"; cat /tmp/body; echo
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for a wrong-audience token, got $CODE. The audience check is NOT holding."
            exit 1
          fi
          echo "✓ refused, as it should be"

  # The shape that actually matters: a reusable workflow in a DIFFERENT repo,
  # pinned by SHA. This is what ravn-actions' collector looks like from a
  # reporter's repo, and the only way to see whether job_workflow_sha names the
  # COLLECTOR's commit or the caller's.
  via-cross-repo:
    uses: dwelch2344/ravn-attestation-collector/.github/workflows/collect.yml@7fa75a6ec7fd85883dc745b24f261d807ca21a66
    permissions:
      id-token: write
      contents: read
