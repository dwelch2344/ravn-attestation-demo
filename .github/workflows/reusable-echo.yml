# Called by echo.yml. Exists purely so one run produces a token minted from
# inside a reusable workflow, to compare against the plain job's claims.
name: reusable echo

on:
  workflow_call: {}

jobs:
  echo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Mint OIDC token from inside a reusable workflow
        env:
          RAVN_ECHO_URL: https://welch.ngrok.io/attestations/echo
          RAVN_AUDIENCE: https://ravnsecurity.io
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint."; exit 1
          fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RAVN_AUDIENCE}" | jq -r '.value')
          echo "Minted token (${#TOKEN} chars). Posting to Ravn…"
          curl -sS -i -X POST "$RAVN_ECHO_URL" -H "Authorization: Bearer $TOKEN"
