# Exactly what a reporter runs: the shipped template's caller workflow, pinned
# at the approved collector, with no base-url override — so it talks to PROD.
name: full cycle

on:
  workflow_dispatch: {}

jobs:
  attest:
    # bedc53a — approved in ravn-actions/approved-workflow-shas.txt on 2026-08-25.
    uses: RavnSecurity/ravn-actions/.github/workflows/collect-profile.yml@bedc53a8ab8d86222a74b1716817ad020336cd2e
    secrets:
      RAVN_READONLY_TOKEN: ${{ secrets.RAVN_READONLY_TOKEN }}
    permissions:
      contents: read
      id-token: write
      attestations: write
