# Exactly what a reporter runs: the shipped template's caller workflow, pinned
# at the approved collector, with no base-url override — so it talks to PROD.
name: full cycle

on:
  workflow_dispatch: {}

jobs:
  attest:
    # adac9b6 — approved in ravn-actions/approved-workflow-shas.txt on 2026-08-25.
    uses: RavnSecurity/ravn-actions/.github/workflows/collect-profile.yml@adac9b69a23a82f838f46622401ff2c6e8641aab
    secrets:
      RAVN_READONLY_TOKEN: ${{ secrets.RAVN_READONLY_TOKEN }}
    permissions:
      contents: read
      id-token: write
      attestations: write
